name: Offline validation
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py providers scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_compounds.py examples/compounds.csv --output /tmp/tnt-stp-pmm-manifest.csv
      - run: python scripts/smoke_app.py

      - name: LIVE PharmMapper form inspection (no final submit)
        if: contains(github.event.head_commit.message, '[probe-pmm]')
        run: |
          python -m playwright install chromium
          python scripts/probe_pmm_step2.py
