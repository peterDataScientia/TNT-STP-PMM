name: Verify actual PharmMapper collection
on:
  push:
    paths:
      - '.github/workflows/verify-pharmmapper.yml'
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python scripts/check_historical_pharmmapper.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PharmMapper-A0-A16-verified
          path: artifacts/PharmMapper_A0_A16_collected.zip
          if-no-files-found: warn
          retention-days: 14
